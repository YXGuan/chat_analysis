name: Publication privacy

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check public data and private file exclusions
        run: python3 scripts/check_publication.py
      - name: Install verified Gitleaks
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output gitleaks_8.30.1_linux_x64.tar.gz
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt --output checksums.txt
          sha256sum --check --ignore-missing checksums.txt
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
      - name: Scan files and complete Git history
        run: |
          "$RUNNER_TEMP/gitleaks" dir . --redact --no-banner --max-decode-depth 3 --max-archive-depth 2
          "$RUNNER_TEMP/gitleaks" git . --redact --no-banner --log-opts="--all --full-history"
