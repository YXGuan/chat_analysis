<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kura Cluster Report</title>
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7;
    --surface: #fcfcfb;
    --ink: #0b0b0b;
    --ink-2: #52514e;
    --muted: #898781;
    --grid: #e1e0d9;
    --axis: #c3c2b7;
    --border: rgba(11, 11, 11, 0.10);
    --wash: rgba(11, 11, 11, 0.04);
    --select: rgba(42, 120, 214, 0.10);
    --neutral: #52514e;
    --user-1: #2a78d6;
    --user-2: #eb6834;
    --user-3: #1baf7a;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page: #0d0d0d;
      --surface: #1a1a19;
      --ink: #f0efec;
      --ink-2: #c3c2b7;
      --muted: #898781;
      --grid: #2c2c2a;
      --axis: #383835;
      --border: rgba(255, 255, 255, 0.10);
      --wash: rgba(255, 255, 255, 0.05);
      --select: rgba(57, 135, 229, 0.20);
      --neutral: #c3c2b7;
      --user-1: #3987e5;
      --user-2: #d95926;
      --user-3: #199e70;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0d0d0d;
    --surface: #1a1a19;
    --ink: #f0efec;
    --ink-2: #c3c2b7;
    --muted: #898781;
    --grid: #2c2c2a;
    --axis: #383835;
    --border: rgba(255, 255, 255, 0.10);
    --wash: rgba(255, 255, 255, 0.05);
    --select: rgba(57, 135, 229, 0.20);
    --neutral: #c3c2b7;
    --user-1: #3987e5;
    --user-2: #d95926;
    --user-3: #199e70;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--ink);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  button, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; border-radius: 4px; }
  .wrap { max-width: 1440px; margin: 0 auto; padding: 24px 16px 48px; }
  .muted { color: var(--ink-2); }
  .count { font-variant-numeric: tabular-nums; color: var(--ink-2); text-align: right; min-width: 3ch; }

  header.top { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
  h1 { font-size: 22px; font-weight: 650; margin: 0 0 4px; }
  .sub { margin: 0; color: var(--ink-2); }
  .ghost {
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    padding: 6px 12px; white-space: nowrap;
  }
  .ghost:hover { background: var(--wash); }

  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin: 20px 0 16px; }
  .tile { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
  .tile-label { font-size: 12px; color: var(--ink-2); }
  .tile-value { font-size: 26px; font-weight: 600; margin-top: 2px; }

  .filters { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 16px; }
  .filters-label { color: var(--ink-2); margin-right: 4px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 999px; padding: 5px 12px;
  }
  .chip:hover { background: var(--wash); }
  .chip[aria-pressed="true"] { border-color: var(--ink); background: var(--select); font-weight: 600; }
  .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 3px; background: var(--c); flex: none; }

  .users { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .user-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
  .user-head { display: flex; align-items: center; gap: 8px; }
  .user-meta { color: var(--ink-2); margin: 2px 0 8px; }
  .user-about { margin: 0 0 8px; }
  .user-top-label { font-size: 12px; color: var(--ink-2); }
  .user-top { margin: 4px 0 0; padding-left: 18px; }
  .user-top li { margin: 2px 0; }
  .user-top li span.count { margin-left: 6px; }

  .layout { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(320px, 1fr); gap: 16px; align-items: start; }
  @media (max-width: 1000px) { .layout { grid-template-columns: minmax(0, 1fr); } }
  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; min-width: 0; }
  .panel-head h2 { font-size: 16px; margin: 0 0 10px; }
  .views { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .views button {
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 4px 10px;
  }
  .views button:hover { background: var(--wash); }
  .views button[aria-pressed="true"] { border-color: var(--ink); background: var(--select); font-weight: 600; }
  .views-label { font-size: 12px; color: var(--ink-2); margin-right: 4px; align-self: center; }
  .help { margin: 0 0 4px; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; color: var(--ink-2); font-size: 12px; margin: 0 0 4px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .levels { color: var(--ink-2); font-size: 12px; margin: 0 0 10px; }
  .tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
  .tools label { color: var(--ink-2); }
  select { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 4px 8px; }
  .notice { color: var(--ink-2); padding: 24px 0; }

  ul.tree, ul.tree ul { list-style: none; margin: 0; padding: 0; }
  .row {
    display: grid; grid-template-columns: 22px minmax(0, 1fr) auto auto; align-items: center; gap: 8px;
    padding: 3px 8px 3px calc(4px + var(--depth) * 18px); border-radius: 6px;
  }
  .row:hover { background: var(--wash); }
  .row.selected { background: var(--select); }
  .twisty { width: 22px; height: 22px; border: 0; background: none; color: var(--ink-2); border-radius: 4px; padding: 0; }
  .twisty:hover { background: var(--wash); }
  .row .name { text-align: left; background: none; border: 0; padding: 2px 0; min-width: 0; overflow-wrap: anywhere; }
  .row.level-0 .name { font-weight: 600; }
  .mix { display: flex; gap: 2px; width: 72px; height: 8px; }
  .mix span { height: 8px; background: var(--c); }
  .mix span:first-child { border-top-left-radius: 4px; border-bottom-left-radius: 4px; }
  .mix span:last-child { border-top-right-radius: 4px; border-bottom-right-radius: 4px; }
  .mix span.off { background: var(--grid); }

  .details { position: sticky; top: 16px; max-height: calc(100vh - 32px); overflow: auto; }
  @media (max-width: 1000px) { .details { position: static; max-height: none; } }
  .crumbs { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; font-size: 12px; color: var(--ink-2); }
  .crumb { background: none; border: 0; padding: 0; color: var(--ink-2); text-decoration: underline; text-underline-offset: 2px; }
  .detail-title { font-size: 18px; margin: 6px 0 4px; }
  .detail-desc { margin: 0 0 8px; }
  .detail-stats { color: var(--ink-2); margin: 0 0 8px; }
  .breakdown { display: flex; flex-wrap: wrap; gap: 6px 14px; margin: 4px 0 8px; }
  .breakdown span { display: inline-flex; align-items: center; gap: 6px; }
  h3 { font-size: 13px; margin: 16px 0 6px; color: var(--ink-2); font-weight: 600; }
  .sub-list { list-style: none; margin: 0; padding: 0; }
  .sub-list li { display: flex; justify-content: space-between; gap: 8px; padding: 2px 0; }
  .link { background: none; border: 0; padding: 0; text-align: left; text-decoration: underline; text-underline-offset: 2px; }
  .chat { border-top: 1px solid var(--grid); padding: 10px 0; }
  .chat-meta { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-2); }
  .chat-summary { margin: 4px 0; }
  .conv summary { cursor: pointer; color: var(--ink-2); font-size: 13px; }
  .msg { margin: 8px 0; padding: 8px 10px; border-radius: 8px; background: var(--wash); }
  .msg.assistant { background: none; border: 1px solid var(--grid); }
  .msg-role { font-size: 12px; font-weight: 600; color: var(--ink-2); margin-bottom: 2px; }
  .msg-text { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 13px; }
  .more { margin-top: 8px; }

  .chart { width: 100%; height: auto; display: block; }
  .chart text { font-size: 12px; fill: var(--ink-2); }
  .chart text.strong { fill: var(--ink); font-weight: 600; }
  .chart text.hero { fill: var(--ink); font-size: 28px; font-weight: 600; }
  .chart .halo { paint-order: stroke; stroke: var(--surface); stroke-width: 3px; stroke-linejoin: round; }
  .chart .link { fill: none; stroke: var(--axis); }
  .chart .flow { fill: none; }
  .chart .flow:hover { stroke-opacity: 0.7; }
  .chart .node { stroke: var(--surface); stroke-width: 2; cursor: pointer; }
  .chart .node:hover { filter: brightness(1.1); }
  .chart .node.selected { stroke: var(--ink); stroke-width: 2.5; }
  .chart .hit { fill: transparent; cursor: pointer; }
  .chart .frame { fill: var(--wash); stroke: var(--grid); }
  .chart .outline { fill: none; stroke: var(--axis); }
  .chart .bar { fill: var(--neutral); fill-opacity: 0.75; }
  .chart .nolabel { pointer-events: none; }
  figcaption { color: var(--ink-2); font-size: 12px; margin-top: 6px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--grid); vertical-align: top; }
  th { color: var(--ink-2); font-weight: 600; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }

  .tooltip {
    position: fixed; z-index: 10; pointer-events: none; max-width: 300px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12); padding: 8px 10px; font-size: 12px;
  }
  .tip-value { font-size: 14px; font-weight: 650; }
  .tip-name { color: var(--ink-2); margin-bottom: 4px; }
  .tip-row { display: flex; align-items: center; gap: 6px; }
  .key { display: inline-block; width: 12px; height: 2px; border-radius: 1px; background: var(--c); }
</style>

5.045658588409424, "chats": ["2111387", "2191566", "2160576", "2234582"]}, {"id": "5a6a0df5d3974263bb18e07f48aaeb8b", "name": "Check whether a lower-current charger can power a laptop", "description": "The user asked whether a charger with a lower current rating could safely and effectively replace a laptop’s original charger. The response advised matching voltage, connector, and polarity, ensuring adequate current capacity, and cautioned that insufficient current could impair operation.", "parent": "6d916050771d474f8a346a0dd571d34c", "level": 1, "x": 11.962545394897461, "y": 5.131155014038086, "chats": ["2245592"]}, {"id": "29f7508e2b91462eb98c8b691968cd6c", "name": "Check whether a lower-current charger can power a laptop", "description": "The user asked whether a charger with lower current output could safely and effectively replace a laptop’s original charger. The response advised verifying voltage, current capacity, connector compatibility, and polarity, while warning that insufficient current might prevent adequate operation.", "parent": "5a6a0df5d3974263bb18e07f48aaeb8b", "level": 2, "x": 12.16284465789795, "y": 5.353102207183838, "chats": ["2245592"]}, {"id": "1486882b9a5a4bfead5deec7e51a55f3", "name": "Check Whether a Lower-Current Charger Can Power a Laptop", "description": "The user asked whether a lower-amperage charger could safely and effectively replace a laptop’s original charger. The response advised checking voltage, current capacity, connector, and polarity, and noted that the lower-current charger might not provide adequate power.", "parent": "29f7508e2b91462eb98c8b691968cd6c", "level": 3, "x": 12.099084854125977, "y": 5.154605865478516, "chats": ["2245592"]}], "chats": {"1935460": {"user": "User 1", "date": "2023-11-29", "turns": 2, "summary": "The user asks how postoperative deaths should be represented in DALY calculations and how to filter CSV lines containing both specified terms; the response correctly explains YLL and gives a piped grep command.", "messages": [["user", "\"The DALY formula was applied to age and gender stratified human CE surgical incidence data. The DALY is made up of two parts; years of life lost due to mortality (YLL) and years of life lost due to time lived in a disability state (YLD). The formulas for YLL and YLD are:\n\nwhere N  =  number of deaths per age-sex group, L  =  remaining life expectancy at age of death\n\nwhere I  =  age and sex specific estimates of incidence, DW  =  disability weight, D  =  average duration of disability.\n\nDisability weight for CE was assigned a multinomial distribution based on numerous retrospective studies evaluating postoperative outcome. In accordance with previous studies, the percentage of patients projected to improve after surgery was assigned a disability weight of 0.200 for 1 year, the percentage of patients projected to have substantial postsurgical complications was assigned a disability of 0.239 for 5 years, the percentage of patients projected to have recurrent disease was assigned a disability of 0.809 for 5 years, and the percentage of patients projected to die postoperatively were assigned a disability of 1 (indicating death) for the remainder of their predicted lifespan.\"\n\nFrom the above paragraph, how do you interpret this part \"[...] and the percentage of patients projected to die postoperatively were assigned a disability of 1 (indicating death) for the remainder of their predicted lifespan.\"; this is accounting as YLDs or as YLLs?"], ["assistant", "The part of the paragraph stating \"the percentage of patients projected to die postoperatively were assigned a disability of 1 (indicating death) for the remainder of their predicted lifespan\" refers to the calculation of Years of Life Lost (YLL) due to mortality, not Years Lived with Disability (YLD).\n\nIn the DALY (Disability-Adjusted Life Year) framework, a disability weight (DW) of 1 indicates death. Hence, for those patients who are projected to die following surgery, their death is accounting for the YLL component of the DALY formula, as they have lost all remaining years of life they were expected to live. The DW of 1 means that they will not be living those years with any quality of life since they have died.\n\nThe following points may help clarify:\n\n- YLL (Years of Life Lost) quantifies the impact of premature mortality by calculating the difference between the age at death and the expected age of natural death based on life expectancy. A DW of 1 is used here to reflect complete loss of life.\n  \n- YLD (Years Lived with Disability) measures the burden of living with a health condition or its consequences. Disability weights (DW) that range from 0 (no disability) to 1 (equivalent to death) are used to reflect the severity of the disability state.\n\nThus, the assignment of a DW of 1 for those projected to die is relevant for YLL calculations, not YLD."], ["user", "how can I combine these cmds:\n\ngrep \"EQUINO\" fallecidos_sinadef.csv |\ngrep \"HIDAT\" fallecidos_sinadef.csv \n\nI just want to catch anything that has \"EQUINO*\" and \"HIDAT*\""], ["assistant", "If you want to combine the two `grep` commands to find lines that contain both \"EQUINO*\" and \"HIDAT*\", you can use a single `grep` with a pattern that requires both strings to be present. However, if you use grep directly with two patterns, it will show lines that match either one of the patterns, not necessarily both.\n\nTo match lines that contain both \"EQUINO\" and \"HIDAT\", you can use two `grep` commands piped together, where the output of the first `grep` (filtering \"EQUINO\") is passed as input to the second `grep` (filtering \"HIDAT\"):\n\n```sh\ngrep \"EQUINO\" fallecidos_sinadef.csv | grep \"HIDAT\"\n```\n\nThis command will first find all lines with \"EQUINO\", and then among those lines, it will further filter to find lines that also contain \"HIDAT\".\n\nIf the order is not important (i.e., \"HIDAT\" can appear before \"EQUINO\"), the same command would work because `grep` does not care about the order of strings in the line. If you want to ensure that \"EQUINO\" appears before \"HIDAT\", you would need a more complex pattern, potentially using `awk` or `grep` with regular expressions.\n\nTo ensure the wildcard effect (to catch anything that starts with \"EQUINO\" and \"HIDAT\", although it's not needed if you're checking for presence) and you're using `grep` which interprets patterns as basic regular expressions by default, the basic `grep` usage would still be similar to the command above, since \"EQUINO\" and \"HIDAT\" are treated as if they have an implied wildcard at the end.\n\nNote that this will only work if both \"EQUINO\" and \"HIDAT\" are on the same line. If these strings can be on different lines and you want to find records that contain both strings anywhere in the file, then you would have to use a more complex pattern that takes into account the structure of the records in the CSV file."]]}, "1937369": {"user": "User 1", "date": "2023-11-29", "turns": 1, "summary": "The user asks how to combine two searches into one grep command to find lines containing either of two text patterns; the response gives an extended-regex solution and clarifies wildcard behavior.", "messages": [["user", "how can I combine these cmds:\n\ngrep “EQUINO” fallecidos_sinadef.csv |\ngrep “HIDAT” fallecidos_sinadef.csv\n\nI just want to catch anything that has “EQUINO*”OR “HIDAT*”"], ["assistant", "You can combine the patterns \"EQUINO\" and \"HIDAT\" into a single `grep` command using an extended regular expression with the `|` (OR) operator. To do so, you need to use the `-E` option with `grep` to enable extended regular expressions. Here's how you can do it:\n\n```bash\ngrep -E 'EQUINO|HIDAT' fallecidos_sinadef.csv\n```\n\nThis command will search for lines in the file `fallecidos_sinadef.csv` that contain either \"EQUINO\" or \"HIDAT\". If you want to make sure the patterns \"EQUINO\" and \"HIDAT\" are followed by ated at a specific time, allowing for an analysis of how these frequencies change over time.\n\nSo, when you come across the phrase \"Number of mutations in each population as a function of time, measured by total derived allele frequency, Mp(t),\" it means that researchers are counting how many mutations have occurred in each population and tracking the prevalence of those mutations over time by looking at how common the resulting derived alleles are. This can show how the genetic variation in the population changes, which can be indicative of various evolutionary processes such as natural selection, genetic drift, migration, or mutation rates."]]}, "2111387": {"user": "User 1", "date": "2023-12-22", "turns": 3, "summary": "The user requested revisions to an academic achievement announcement, adjusted its tone to be less formal, and then asked for a Spanish translation.", "messages": [["user", "correct this:\n\nI'm very happy to share that I was condecorated as Summa Cum Laude by the National University of San Marcos (UNMSM). This award is the result of occupying the first place at the Veterinary Medicine School for six consecutive years. Very excited about what is next!\n\nneeds to be professional "], ["assistant", "I am pleased to announce that I have been honored with the distinction of Summa Cum Laude by the National University of San Marcos (UNMSM). This accolade acknowledges my achievement of securing first place in the Veterinary Medicine School for six consecutive years. I am eagerly looking forward to the future opportunities this recognition will bring."], ["user", "little less professional"], ["assistant", "I'm thrilled to share that the National University of San Marcos (UNMSM) has recognized me with the Summa Cum Laude distinction. This honor comes after holding the top spot in the Veterinary Medicine School for six years running. Can't wait to see what's on the horizon!"], ["user", "translate this to spanish:\n\nI’m thrilled to share that the National roportions of the data rather than the sheer quantity.\n\nYou'll need to use a programming language with plotting capabilities, such as Python with libraries like Matplotlib or Seaborn for visualization and Pandas for data manipulation. Here's an example of how you can create such a histogram using Python with Matplotlib:\n\n```python\nimport pandas as pd\nimport matplotlib.pyplot as plt\n\n# Assuming your data is in a CSV file named 'data.csv' with a column named 'lengths'\ndf = pd.read_csv('data.csv')\n\n# Plot a histogram with density=True to normalize the amplitude\nplt.hist(df['lengths'], bins=30, density=True)\n\nplt.xlabel('Length')\nplt.ylabel('Normalized Amplitude')\nplt.title('Histogram of Lengths with Normalized Amplitude')\n\n# Show the plot\nplt.show()\n```\n\nThis code does the following:\n\n1. Import necessary libraries.\n2. Read your dataset into a DataFrame assuming it's in a CSV format.\n3. Plot the histogram using `plt.hist()` with `density=True` to ensure that the y-axis shows a normalized amplitude.\n4. Label the x-axis ('Length'), y-axis ('Normalized Amplitude'), and the title of the histogram.\n5. Finally, it displays the plot.\n\nThis is a basic example and you might need to adjust the bin size (`bins=30`), labels, titles, or other parameters based on your specific dataset and preferences. If your data is not in a CSV file or has a different structure, you'll need to adapt the code to load and handle your data accordingly."]]}, "2234582": {"user": "User 1", "date": "2024-01-24", "turns": 2, "summary": "The user asks whether it is appropriate to request interview-preparation guidance and what to prepare; the response suggests confirming attendance and politely asking about topics, materials, or expectations.", "messages": [["user", "Hi!"], ["assistant", "Hello! How can I assist you today?"], ["user", "I received this:\n\n\"\nHi Pepito,\n\nThank you very much for your response and for the additional information. I have scheduled you for an inte e their features and suggest sequence and domain searches, while noting direct homologs are unlikely.", "messages": [["user", "Hi!"], ["assistant", "Hello! How can I assist you today?"], ["user", "Could you explain to me what are PPE/PE families in M.tuberculosis?"], ["assistant", "In Mycobacterium tuberculosis, the causative agent of tuberculosis, two families of proteins stand out due to their abundance and role in the pathogenesis of the bacterium: the PPE and PE families.\n\n1. **PE Family**: The name \"PE\" comes from the amino acid sequence Pro-Glu (Proline-Glutamic acid) at the N-terminal of these proteins. Members of this family have a conserved N-terminal domain of approximately 110 amino acids, but they can vary considerably in their C-terminal sequences. These proteins are involved in various functions, including antigenic variation, immune evasion, and potentially virulence. The PE family can be further subdivided into subfamilies, including PE-only and PE_PGRS (with a Polymorphic GC-rich repetitive sequence).\n\n2. **PPE Family**: Similarly, \"PPE\" proteins get their name from the Pro-Pro-Glu (P-Proline, P-Proline, Glu-Glutamic acid) motif at their N-terminus. Like PE proteins, the PPE family also shares a conserved domain at the N-terminus, but their C-terminal domains are highly polymorphic. The PPE family is also implicated in antigenic variation and may play a role in modulating the host immune response. There is also a subset known as PPE_MPTR, characterized by a major polymorphic tandem repeats (MPTR) domain within the C-terminal.\n\nBoth the PE and PPE families are unique to mycobacteria and have significantly expanded in M. tuberculosis, indicating a potential role in the pathogenicity and adaptability of the bacterium. There is significant interest in these protein families because understanding their precise function could provide insights into how M. tuberculosis evades host immunity and could inform the development of novel diagnostics, vac f you attempt to use it for an extended period.\n\nIt's always best to use a charger that matches the specifications of the original one that came with your laptop, or one that is recommended by the laptop's manufacturer."]]}, "2265250": {"user": "User 1", "date": "2024-02-03", "turns": 9, "summary": "The user asks how paired-read BAM flags and orientations are determined from pseudoalignment data. The assistant explains that the provided tuples lack pairing, alignment strand, and mate information, while earlier responses make unsupported assumptions about flag assignment.", "messages": [["user", "Kallisto has an option called \"--genomebam\" where it outputs aligned reads in BAM format. This BAM format provides the common BAM flag that indicates if the read is paired and other stuff. How does it do it?"], ["assistant", "The `--genomebam` flag in Kallisto is used to generate BAM formatted files that contain alignment information of reads to the reference genome. However, it's important to understand that Kallisto is primarily a transcriptome quantification tool, which operates based on pseudoalignment. It doesn't produce traditional alignments like tools such as BWA or Bowtie do; instead, Kallisto quickly approximates which transcripts the reads could come from without exact base pair alignments.\n\nHere's a simplified overview of how Kallisto and the `--genomebam` option works:\n\n1. Kallisto receives sequencing reads and performs pseudoalignment against a transcriptome index. It estimates the abundance of transcripts without requiring full, accurate alignments. Instead, it identifies which transcripts a given read is compatible with based on k-mer matches.\n\n2. When you use the `--genomebam` option, post-pseudoalignment processing occurs:\n   - It requires a genome reference as well as a GTF/GFF file to map the transcriptome coordinates onto the genome.\n   - Kallisto will take the pseudoalignments it has generated and then project these onto the genome. This process converts transcript coordinates back to genomic coordinates, thereby creating a BAM file that looks like reads have been aligned to the genome.\n\n3. BAM File Formatting:\n   - For paired-end reads, Kallisto will use the information it has from the fastq files to set the correct flags in the BAM file. The BAM flags are bits of information that describe properties of each read or read pair. Common flags include whether a read is mapped in a proper pair, which read is first in the pair (if paired), whether the read is unmapped, etc.\n   - The tool takes care of interpreting the paired-end information and setting up the appropriate flags based on the relationship between the reads and their pseudoalignment against the transcripts (and by extension to their positions on the genome).\n\n4. The output BAM file can then be inspected usin ... [shortened]"], ["user", "elaborate on this:\n\n\"- For paired-end reads, Kallisto will use the information it has from the fastq files to set the correct flags in the BAM file. The BAM flags are bits of information that describe properties of each read or read pair. Common flags include whether a read is mapped in a proper pair, which read is first in the pair (if paired), whether the read is unmapped, etc.\n- The tool takes care of interpreting the paired-end information and setting up the appropriate flags based on the relationship between the reads and their pseudoalignment against the transcripts (and by extension to their positions on the genome).\""], ["assistant", "Kallisto, when used with the `--genomebam` option for paired-end reads, will process the read data and generate a BAM file that includes various pieces of metadata about each read. The BAM format uses a series of flags (stored as bitwise flags) to convey this information. These flags are defined by the SAM/BAM format specification and are encoded as an integer where different bits in the number represent different Boolean values (true/false) corresponding to the state or properties of the read or read pair.\n\nHere's a summary of common flags and their meanings in SAM/BAM:\n\n- `0x1`: Read is paired\n- `0x2`: Read is mapped in proper pair\n- `0x4`: Read is unmapped\n- `0x8`: Mate is unmapped\n- `0x10`: Read is reverse complemented\n- `0x20`: Mate is reverse complemented\n- `0x40`: Read is the first read in a pair\n- `0x80`: Read is the second read in a pair\n\nWhen Kallisto processes paired-end reads, it uses the input from the FASTQ files (which contain the raw sequence data) and its pseudoalignment algorithm (mapping short reads to the transcriptome) to determine the relationship between the reads. Based on this information, Kallisto sets the appropriate flags in the BAM file that it generates:\n\n- It determines whether each read is properly paired with its mate based on its pseudoalignment to the transcripts. If both reads in a pair match the same transcript in a way that is consistent with the expected library fragment size and orientation, the tool can set the \"mapped in proper pair\" flag (`0x2`).\n\n- It establishes which read is the first in the pair and which is the second, setting the `0x40` or `0x80` flags accordingly. This information is inherent in the structure of the paired-end FASTQ files where reads are ordered sequentially with the first read of the first pair followed by the first read of the second pair, etc., and the same for the second reads.\n\n- If any of the reads do not pseudoalign to any transcript (and therefore will not be placed onto the genome), Kallisto ... [shortened]"], ["user", "ok, for example, I have this data:\n\n(false, \"gencode_small_line15\", [0, 1, 30, 25224, 145542, 145543, 145544, 145545, 145546], 60)\n(false, \"gencode_small_line15_err51\", [0, 1, 30, 25224, 145542, 145543, 145544, 145545, 145546], 60)\n(false, \"gencode_small_line45_err24\", [25222], 60)\n(false, \"gencode_small_line45\", [2, 31, 89286, 115458, 145534, 145535, 145536, 145537, 145538, 145539, 145540, 172171, 172172, 172173, 172175, 172176, 172177, 172178], 60)\n(false, \"gencode_small_line60\", [2, 31, 25222, 25223, 145538, 145539, 145540], 60)\n(false, \"gencode_small_line60_err47\", [2, 31, 25222, 25223, 145538, 145539, 145540], 60)\n\nwhere (mapped_correctly, read name (as in fastq), equivalent classes, coverage)\n\nhow can I calculate all of those flags?"], ["assistant", "The given data seems to represent some form of simplified alignment or pseudoalignment output, mentioning if reads are correctly mapped, their names, equivalence classes (which I will assume refer to groups of transcripts that the read could pseudoalign to), and coverage (which may refer to mapping quality or some other metric).\n\nWhile it’s not an actual Kallisto output, let’s interpret the data under the assumption that you wish to map these properties to SAM/BAM flags. Note that with only this information, we may make some assumptions and could not accurately set all flags.\n\nHere's what we can infer based on the tuples provided:\n\n- `mapped_correctly`: We can use this to set the `0x4` flag (read is unmapped) if `mapped_correctly` is `false`. However, since all entries in your data are `false`, it's unclear whether any should be marked as `unmapped`. If this were `true`, and assuming proper pairs, you'd potentially set the `0x2` flag (read mapped in proper pair).\n- `read name`: This won't directly translate to flags, but may indicate if a read is the first or second in a pair if a naming convention is used (e.g., read names ending in `/1` or `/2`).\n- `equivalence classes`: We cannot directly derive flags from this, but it may help infer whether pairs map correctly if names suggest they are pairs.\n- `coverage`: Not a direct factor when setting SAM flags. If this were mapping quality, it would go into the MAPQ field.\n\nWithout explicit information on whether each read is part of a pair, which member of the pair it is, and what their orientations should be, we have limited ability to set flags. We can, however, highlight potential flags based on usual practices:\n\n- All reads are marked as `mapped_correctly = false`, so we wouldn't set the `0x4` flag based on standard logic. But if this were to represent incorrect mapping, we'd need that clarification to proceed correctly.\n- Assuming paired reads, we'd expect information about which read is first or second. Without that, ... [shortened]"], ["user", "is it possible to know the orientations of the read?"], ["assistant", "From the data provided, the orientations of the reads cannot be directly inferred. Orientation information in traditional alignment outputs indicates whether the read is aligned to the forward or reverse strand of the reference genome or transcriptome. In SAM/BAM files, this is indicated by the `0x10` flag for the read being reverse complemented, and the `0x20` flag for the mate being reverse complemented.\n\nFor determining read orientations, aligners use sequencing data and the alignment process. They consider specifics such as:\n\n- Whether the library was prepared with a specific orientation (e.g., strand-specific libraries).\n- The alignment of the read sequence to the reference – aligners analyze the sequence and its reverse complement to see which one better matches the reference.\n- The expected orientation of read pairs – for paired-end sequencing, read1 and read2 are usually oriented towards each other.\n\nThe data you've provided does not include this necessary information. It only has a boolean for whether the read is \"mapped correctly\" (without defining correctness), the read names, an array that may represent the transcript equivalence class, and a coverage or score value. Without knowing the alignment algorithm's decisions and the reference orientation for each read, we cannot determine the direction of the reads.\n\nIn practice, when working with real sequencing data and alignment tools, you would either receive orientation information directly in the output files (such as BAM), or you would be able to infer it from the context based on the experimental setup and the specifics of your library preparation protocol. If you were indeed using Kallisto with the `--genomebam` option, as mentioned earlier, Kallisto would internally determine the read orientations and represent this information in the output BAM file."]]}, "2295763": {"user": "User 1", "date": "2024-02-11", "turns": 3, "summary": "The user asks about coloring separate parts of a focused workspace label in an i3 bar, then asks how to combine disk and memory values into a slash-separated string.", "messages": [["user", "HI"], ["assistant", "Hello! How can I assist you today?"], ["user", "this is the colors of my custom i3 bar:\n\nbar {\n\t\tposition top\n        status_command i3blocks\n        height 20\n        colors {\n            #background #001587\n            background #011679\n        #\n        focused_workspace #ffffff #001db9 #f58c1d\n        active_workspace #333333 #001db9 #ffffff\n        inactive_workspace #333333 #001db9 #888888\n        urgent_workspace #2f343a #900000 #ffffff\n        }\n}\n\nand \n\nset $ws1 \"1: brave\"\n\nis it possible to make \"1: brave\" be highlighted in 2 different colors where focused?: when that window is focus I want the number \"1\" to be #f58c1d but the word \"brave\" to be white"], ["assistant", "i3bar, which is typically used with the i3 window manager, doesn't support such fine-grained color customization out of the box. It allows you to set colors for entire workspace buttons, but not for individual parts of a workspace name.\n\nHowever, there is a potential workaround that involves using Unicode characters to create colored blocks or separators that can give the visual effect of different colors, but this would not change the color of specific text portions. This isn't exactly what you're asking for, but it's a common approach to visually distinguish different parts of workspace names.\n\nIf you're open to exploring th <script>
"use strict";

const DATA = JSON.parse(document.getElementById("kura-data").textContent);

const CLUSTERS = DATA.clusters;
const byId = new Map(CLUSTERS.map((c) => [c.id, c]));
const kids = new Map();
for (const c of CLUSTERS) {
  const parent = c.parent && byId.has(c.parent) ? c.parent : null;
  if (!kids.has(parent)) kids.set(parent, []);
  kids.get(parent).push(c);

for (const list of kids.values()) {
  list.sort((a, b) => b.chats.length - a.chats.length || a.name.localeCompare(b.name));
}
const roots = kids.get(null) || [];

const mixOf = new Map(CLUSTERS.map((c) => {
  const mix = USERS.map(() => 0);
  for (const id of c.chats) {
    const slot = userSlot.get(DATA.chats[id] && DATA.chats[id].user);
    if (slot) mix[slot - 1] += 1;
  }
  return [c.id, mix];
}));

const VIEWS = [
  { id: "list", name: "List", help: "Every cluster as an outline you can open and close. The easiest way to read the names." },
  { id: "tree", name: "Tree", d3: true, help: "A node-link tree. Each group branches into the smaller clusters inside it. Bigger dots and thicker lines mean more chats." },

  { id: "sunburst", name: "Sunburst", d3: true, help: "Rings from the center outward: top-level groups first, then the clusters inside them. Wider slices hold more chats." },
  { id: "icicle", name: "Icicle", d3: true, help: "Like the sunburst, but in straight columns from left to right, so the names are easier to read." },
  { id: "treemap", name: "Treemap", d3: true, help: "Each box is a base cluster, sized by its chats. Boxes sit inside the frame of their top-level group." },
  { id: "pack", name: "Circles", d3: true, help: "Clusters drawn as circles inside the circles of the groups they belong to." },
  { id: "network", name: "Network", d3: true, help: "A graph that links each user to the base clusters they chat about, and each cluster to its group. Clusters that several users share get pulled into the middle." },

  { id: "map", name: "Map", help: "Kura's map of the clusters at one level. Clusters that sit close together are about similar things. Bigger dots hold more chats." },

// ---------- helpers ----------
function el(tag, attrs, ...children) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(attrs || {})) {
    if (value === null || value === undefined || value === false) continue;
    if (key === "class") node.className = value;
    else if (key.startsWith("on")) node.addEventListener(key.slice(2), value);
    else node.setAttribute(key, value === true ? "" : String(value));
  }
  for (const child of children.flat(Infinity)) {
    if (child === null || child === undefined || child === false) continue;
    node.append(child instanceof Node ? child : String(child));
  }
  return node;
}
function swatch(slot) {

}

  const date = new Date(`${text}T00:00:00`);
  return Number.isNaN(date.getTime()) ? text : dateFormat.format(date);
}
function fmtRange(a, b) {
  return a === b ? fmtDate(a) : `${fmtDate(a)} – ${fmtDate(b)}`;
}

  return state.user ? USERS[userSlot.get(state.user) - 1].chats : Object.keys(DATA.chats).length;

  const path = [];
  let parent = c.parent ? byId.get(c.parent) : null;
  while (parent) {
    path.unshift(parent);
    parent = parent.parent ? byId.get(parent.parent) : null;
  }
  return path;
}
function keepFocus(container, render) {
  const active = document.activeElement;
  const key = active && active.dataset ? active.dataset.focus : null;
  render();
  if (key) {
    const again = container.querySelector(`[data-focus="${CSS.escape(key)}"]`);
    if (again) again.focus();
  }
}
const measure = document.createElement("canvas").getContext("2d");
function textWidth(text, size, weight) {
  measure.font = `${weight || 400} ${size || 12}px system-ui, -apple-system, "Segoe UI", sans-serif`;
  return measure.measureText(text).width;
}
function fit(text, maxWidth, size, weight) {
  if (maxWidth < 24) return "";
  if (textWidth(text, size, weight) <= maxWidth) return text;
  let lo = 0, hi = text.length;
  while (lo < hi) {
    const mid = (lo + hi + 1) >> 1;
    if (textWidth(`${text.slice(0, mid)}…`, size, weight) <= maxWidth) lo = mid;
    else hi = mid - 1;
  }
  return lo >= 4 ? `${text.slice(0, lo).trimEnd()}…` : "";
}

// With a user picked: that user's color, darker when more of the cluster is theirs.
function paint(c) {
  if (!c) return ["var(--neutral)", 0.18];
  if (!USERS.length) return ["var(--user-1)", Math.max(0.3, 0.9 - 0.15 * c.level)];
  const mix = mixOf.get(c.id);
  const total = mix.reduce((a, b) => a + b, 0);
  if (!total) return ["var(--grid)", 1];
  if (state.user) {
    const i = userSlot.get(state.user) - 1;
    return mix[i] ? [`var(--user-${i + 1})`, 0.3 + 0.7 * (mix[i] / total)] : ["var(--grid)", 1];
  }
  const most = Math.max(...mix);
  const leaders = mix.flatMap((n, i) => (n === most ? [i] : []));
  if (leaders.length > 1) return ["var(--neutral)", 0.45];
  return [`var(--user-${leaders[0] + 1})`, 0.3 + 0.7 * (most / total)];
}

// ---------- tooltip ----------
const tip = document.getElementById("tooltip");
function placeTip(x, y) {
  tip.hidden = false;
  const left = Math.min(x + 14, window.innerWidth - tip.offsetWidth - 8);
  const top = Math.min(y + 14, window.innerHeight - tip.offsetHeight - 8);
  tip.style.left = `${Math.max(8, left)}px`;
  tip.style.top = `${Math.max(8, top)}px`;
}
function showTip(c, x, y) {
  const n = c ? count(c) : totalChats();
  const parts = [el("div", { class: "tip-value" }, plural(n, "chat")), el("div", { class: "tip-name" }, c ? c.name : "All chats")];
  if (c && USERS.length > 1) {
    USERS.forEach((u, i) => {
      parts.push(el("div", { class: "tip-row" },
        el("span", { class: "key", style: `--c: var(--user-${i + 1})` }),
        el("strong", {}, mixOf.get(c.id)[i]),
        el("span", { class: "muted" }, u.label)));
    });
  }
  tip.replaceChildren(...parts);
  placeTip(x, y);
}
function showFlowTip(link, x, y) {
  const user = USERS[link.slot - 1];
  tip.replaceChildren(
    el("div", { class: "tip-value" }, plural(link.value, "chat")),
    el("div", { class: "tip-name" }, `${link.source.name} → ${link.target.name}`),
    user ? el("div", { class: "tip-row" }, el("span", { class: "key", style: `--c: var(--user-${link.slot})` }), el("span", { class: "muted" }, user.label)) : null);
  placeTip(x, y);
}
function hideTip() { tip.hidden = true; }
function tipEvents(node, c) {
  node.addEventListener("pointermove", (e) => showTip(c, e.clientX, e.clientY));
  node.addEventListener("pointerleave", hideTip);
  node.addEventListener("focus", () => {
    const box = node.getBoundingClientRect();
    showTip(c, box.right, box.top);
  });
  node.addEventListener("blur", hideTip);
}

// ---------- header, summary, filters, users ----------
function renderHeader() {
  document.getElementById("title").textContent = DATA.title;
  document.getElementById("subtitle").textContent = DATA.subtitle;
  document.getElementById("levels").textContent = maxLevel === 0
    ? `1 level: ${plural(levelCounts[0], "cluster")}. There were too few chats to group them further.`
    : `${maxLevel + 1} levels, from ${plural(levelCounts[0], "top-level group")} down to ${plural(levelCounts[maxLevel], "base cluster")}: ${levelCounts.join(" › ")}`;
}

function renderKpis() {
  const tiles = [["Chats", totalChats()]];
  if (USERS.length) tiles.push(["Users", USERS.length]);
  tiles.push(["Clusters", CLUSTERS.filter((c) => count(c) > 0).length], ["Levels", maxLevel + 1]);
  document.getElementById("kpis").replaceChildren(...tiles.map(([label, value]) =>
    el("div", { class: "tile" },
      el("div", { class: "tile-label" }, label),
      el("div", { class: "tile-value" }, value.toLocaleString("en-US")))));
}

function renderFilters() {
  const box = document.getElementById("filters");
  if (USERS.length < 2) { box.hidden = true; return; }
  const chip = (text, value, slot) => el("button", {
    type: "button", class: "chip", "data-focus": `chip-${value || "all"}`,
    "aria-pressed": String(state.user === value), onclick: () => setUser(value),
  }, slot ? swatch(slot) : null, text);
  keepFocus(box, () => box.replaceChildren(
    el("span", { class: "filters-label" }, "Show chats from"),
    chip("All users", null),
    ...USERS.map((u, i) => chip(`${u.label} (${u.chats})`, u.label, i + 1))));
}

function renderUsers() {
  const box = document.getElementById("users");
  if (!USERS.length) { box.hidden = true; return; }
  box.replaceChildren(...USERS.map((u, i) => {
    const top = roots
      .map((r) => [r, mixOf.get(r.id)[i]])
      .filter(([, n]) => n > 0)
      .sort((a, b) => b[1] - a[1])
      .slice(0, 3);
    return el("article", { class: "user-card" },
      el("div", { class: "user-head" }, swatch(i + 1), el("strong", {}, u.label),
        el("span", { class: "muted" }, plural(u.chats, "chat"))),
      el("div", { class: "user-meta" }, `${fmtRange(u.first, u.last)} · ${u.country}`),
      u.about ? el("p", { class: "user-about" }, u.about) : null,
      el("div", { class: "user-top-label" }, "Talks most about"),
      el("ol", { class: "user-top" }, top.map(([r, n]) =>
        el("li", {}, el("button", { type: "button", class: "link", onclick: () => select(r.id) }, r.name),
          el("span", { class: "count" }, n)))));
  }));
}

function renderViewPicker() {
  const box = document.getElementById("views");
  keepFocus(box, () => box.replaceChildren(
    el("span", { class: "views-label" }, "View"),
    ...VIEWS.map((v) => el("button", {
      type: "button", "data-focus": `view-${v.id}`, "aria-pressed": String(state.view === v.id),
      onclick: () => setView(v.id),
    }, v.name))));
  const view = VIEWS.find((v) => v.id === state.view);
  document.getElementById("help").textContent = view.help;

  document.getElementById("legend").replaceChildren(...legendParts());
}

function legendParts() {
  const keys = USERS.map((u, i) => el("span", {}, swatch(i + 1), u.label));
  if (state.view === "table") return [];
  if (!USERS.length) {
    return state.view === "list" || state.view === "flow" ? [] : [el("span", {}, "Darker colors mark higher levels.")];
  }
  if (state.view === "list") return [el("span", {}, "The bar next to each cluster shows its mix of users.")];
  if (state.view === "flow") return [...keys, el("span", {}, "Each band's color shows whose chats it carries.")];
  if (state.user) {
    return [el("span", {}, swatch(userSlot.get(state.user)),
      `Clusters with chats from ${state.user}. Darker means more of the cluster is theirs.`)];
  }
  const tie = el("span", { class: "swatch", style: "--c: var(--neutral); opacity: 0.45", "aria-hidden": "true" });
  return [...keys, el("span", {}, tie, "Tie"),
    el("span", {}, "Color shows the user with the most chats in a cluster. Paler means the cluster mixes users.")];
}

// ---------- list view ----------
function mixBar(c) {
  if (USERS.length < 2) return el("span", {});
  const mix = mixOf.get(c.id);
  const total = mix.reduce((a, b) => a + b, 0) || 1;
  const bar = el("span", { class: "mix", "data-focus": `mix-${c.id}`, tabindex: "0",
    "aria-label": USERS.map((u, i) => `${u.label}: ${mix[i]}`).join(", ") });
  mix.forEach((n, i) => {
    if (!n) return;
    const off = state.user && state.user !== USERS[i].label;
    bar.append(el("span", { class: off ? "off" : null, style: `--c: var(--user-${i + 1}); flex: ${n / total} 1 0` }));
  });
  tipEvents(bar, c);
  return bar;
}

function listItem(c) {
  const children = (kids.get(c.id) || []).filter((k) => count(k) > 0);
  const open = state.expanded.has(c.id);
  const selected = state.selected === c.id;
  const toggle = children.length
    ? el("button", {
      type: "button", class: "twisty", "data-focus": `twisty-${c.id}`,
      "aria-label": `${open ? "Collapse" : "Expand"} ${c.name}`,
      onclick: () => toggleOpen(c.id),
    }, open ? "▾" : "▸")
    : el("span", {});
  const row = el("div", { class: `row level-${c.level}${selected ? " selected" : ""}`, style: `--depth: ${c.level}` },
    toggle,
    el("button", { type: "button", class: "name", "data-focus": `name-${c.id}`, onclick: () => select(c.id) }, c.name),
    mixBar(c),
    el("span", { class: "count" }, count(c)));
  const item = el("li", {
    role: "treeitem", "aria-selected": String(selected),
    "aria-expanded": children.length ? String(open) : null,
  }, row);
  if (children.length && open) item.append(el("ul", { role: "group" }, children.map(listItem)));
  return item;
}

function renderList(box) {
  const tools = el("div", { class: "tools" },
    el("button", { type: "button", class: "ghost", onclick: () => {
      for (const c of CLUSTERS) if ((kids.get(c.id) || []).length) state.expanded.add(c.id);
      renderView();
    } }, "Expand all"),
    el("button", { type: "button", class: "ghost", onclick: () => { state.expanded.clear(); renderView(); } }, "Collapse all"));
  const tree = el("ul", { class: "tree", role: "tree", "aria-label": "Cluster outline" },
    roots.filter((r) => count(r) > 0).map(listItem));
  box.replaceChildren(tools, tree);
}

// ---------- table view ----------
function renderTable(box) {
  const rows = [];
  const walk = (c) => {
    if (count(c) === 0) return;
    rows.push(c);
    for (const k of kids.get(c.id) || []) walk(k);
  };
  roots.forEach(walk);
  const head = el("tr", {}, el("th", { scope: "col", class: "num" }, "Level"), el("th", { scope: "col" }, "Cluster"),
    el("th", { scope: "col", class: "num" }, "Chats"),
    USERS.length > 1 ? USERS.map((u) => el("th", { scope: "col", class: "num" }, u.label)) : null);
  const body = rows.map((c) => el("tr", {},
    el("td", { class: "num" }, c.level + 1),
    el("td", { style: `padding-left: ${8 + c.level * 16}px` },
      el("button", { type: "button", class: "link", onclick: () => select(c.id) }, c.name)),
    el("td", { class: "num" }, count(c)),
    USERS.length > 1 ? mixOf.get(c.id).map((n) => el("td", { class: "num" }, n)) : null));
  box.replaceChildren(el("table", {}, el("thead", {}, head), el("tbody", {}, body)));
}

// ---------- shared chart helpers ----------
function chartWidth(box) {
  return Math.max(560, Math.floor(box.clientWidth || 760));
}
function newChart(viewBox, label) {
  return d3.create("svg").attr("class", "chart").attr("viewBox", viewBox).attr("role", "img").attr("aria-label", label);
}
function buildHierarchy() {
  const make = (c) => ({ c, children: (kids.get(c.id) || []).filter((k) => count(k) > 0).map(make) });
  const data = { c: null, children: roots.filter((r) => count(r) > 0).map(make) };
  return d3.hierarchy(data, (d) => (d.children && d.children.length ? d.children : null))
    .sum((d) => (d.children && d.children.length ? 0 : (d.c ? count(d.c) : 0)))
    .sort((a, b) => b.value - a.value);
}
function fill(selection, getCluster) {
  return selection
    .style("fill", (d) => paint(getCluster(d))[0])
    .style("fill-opacity", (d) => paint(getCluster(d))[1]);
}
function bind(selection, getCluster) {
  return selection
    .on("click", (event, d) => { const c = getCluster(d); if (c) select(c.id); })
    .on("pointermove", (event, d) => showTip(getCluster(d), event.clientX, event.clientY))
    .on("pointerleave", hideTip);
}
function isSelected(c) {
  return Boolean(c && c.id === state.selected);
}
function radiusScale(maxValue, low, high) {
  return (value) => low + (high - low) * Math.sqrt(value / (maxValue || 1));
}

// ---------- tree (node-link) ----------
function renderTreeChart(box) {
  const root = buildHierarchy();
  const W = chartWidth(box);
  const labelWidth = Math.min(280, W * 0.34);
  const rowHeight = 22;
  const H = Math.max(360, root.leaves().length * rowHeight + 40);
  const depth = Math.max(1, root.height);
  const columnWidth = (W - labelWidth - 70) / depth;
  d3.tree().size([H - 40, depth * columnWidth]).separation((a, b) => (a.parent === b.parent ? 1 : 1.4))(root);
  const r = radiusScale(root.value, 3, 11);
  const chart = newChart([0, 0, W, H], "Tree of clusters");
  const g = chart.append("g").attr("transform", "translate(48, 20)");
  g.append("g").selectAll("path").data(root.links()).join("path")
    .attr("class", "link")
    .attr("stroke-width", (d) => 1 + 5 * Math.sqrt(d.target.value / (root.value || 1)))
    .attr("d", d3.linkHorizontal().x((d) => d.y).y((d) => d.x));
  const node = g.append("g").selectAll("g").data(root.descendants()).join("g")
    .attr("transform", (d) => `translate(${d.y},${d.x})`);
  node.append("circle").attr("class", "hit").attr("r", 12);
  fill(node.append("circle")
    .attr("class", (d) => `node${isSelected(d.data.c) ? " selected" : ""}`)
    .attr("r", (d) => r(d.value)), (d) => d.data.c);
  node.filter((d) => !d.children).append("text")
    .attr("class", "halo nolabel").attr("x", (d) => r(d.value) + 6).attr("dy", "0.32em")
    .text((d) => fit(d.data.c.name, labelWidth - 10));
  node.filter((d) => d.children && d.depth > 0).append("text")
    .attr("class", (d) => `halo nolabel${d.depth === 1 ? " strong" : ""}`)
    .attr("y", (d) => -r(d.value) - 5).attr("text-anchor", "middle")
    .text((d) => fit(d.data.c.name, columnWidth * 0.95));
  node.filter((d) => d.depth === 0).append("text")
    .attr("class", "halo nolabel strong").attr("x", -8).attr("dy", "0.32em").attr("text-anchor", "end")
    .text("All");
  bind(node, (d) => d.data.c);
  box.replaceChildren(chart.node());
}

// ---------- radial tree ----------
function renderRadial(box) {
  const root = buildHierarchy();
  const W = Math.min(chartWidth(box), 900);
  const labelWidth = Math.min(180, W * 0.2);
  const R = W / 2 - labelWidth - 12;
  d3.cluster().size([2 * Math.PI, R]).separation((a, b) => (a.parent === b.parent ? 1 : 2) / Math.max(1, a.depth))(root);
  const r = radiusScale(root.value, 2.5, 9);
  const chart = newChart([-W / 2, -W / 2, W, W], "Radial tree of clusters");
  chart.append("g").selectAll("path").data(root.links()).join("path")
    .attr("class", "link")
    .attr("stroke-width", (d) => 1 + 4 * Math.sqrt(d.target.value / (root.value || 1)))
    .attr("d", d3.linkRadial().angle((d) => d.x).radius((d) => d.y));
  const node = chart.append("g").selectAll("g").data(root.descendants()).join("g")
    .attr("transform", (d) => `rotate(${(d.x * 180) / Math.PI - 90}) translate(${d.y},0)`);
  node.append("circle").attr("class", "hit").attr("r", 10);
  fill(node.append("circle")
    .attr("class", (d) => `node${isSelected(d.data.c) ? " selected" : ""}`)
    .attr("r", (d) => r(d.value)), (d) => d.data.c);
  node.filter((d) => !d.children).append("text")
    .attr("class", "halo nolabel")
    .attr("dy", "0.32em")
    .attr("x", (d) => (d.x < Math.PI ? 1 : -1) * (r(d.value) + 5))
    .attr("text-anchor", (d) => (d.x < Math.PI ? "start" : "end"))
    .attr("transform", (d) => (d.x >= Math.PI ? "rotate(180)" : null))
    .text((d) => fit(d.data.c.name, labelWidth));
  bind(node, (d) => d.data.c);
  // Top-level group names, written flat so they are easy to read
  chart.append("g").selectAll("text").data(root.children || []).join("text")
    .attr("class", "halo nolabel strong")
    .attr("x", (d) => Math.cos(d.x - Math.PI / 2) * d.y)
    .attr("y", (d) => Math.sin(d.x - Math.PI / 2) * d.y - r(d.value) - 6)
    .attr("text-anchor", "middle")
    .text((d) => fit(d.data.c.name, 150));
  box.replaceChildren(chart.node());
}

// ---------- sunburst ----------
function renderSunburst(box) {
  const root = buildHierarchy();
  const W = Math.min(chartWidth(box), 820);
  const R = W / 2 - 4;
  d3.partition().size([2 * Math.PI, root.height + 1])(root);
  const ring = R / (root.height + 1);
  const arc = d3.arc()
    .startAngle((d) => d.x0).endAngle((d) => d.x1)
    .padAngle((d) => Math.min((d.x1 - d.x0) / 2, 0.006)).padRadius(R / 2)
    .innerRadius((d) => d.y0 * ring).outerRadius((d) => d.y1 * ring - 2);
  const chart = newChart([-W / 2, -W / 2, W, W], "Sunburst of clusters");
  const parts = root.descendants().filter((d) => d.depth > 0);
  bind(fill(chart.append("g").selectAll("path").data(parts).join("path")
    .attr("class", (d) => `node${isSelected(d.data.c) ? " selected" : ""}`)
    .attr("d", arc), (d) => d.data.c), (d) => d.data.c);
  chart.append("g").selectAll("text").data(parts.filter((d) => (d.x1 - d.x0) * ((d.y0 + d.y1) / 2) * ring > 14)).join("text")
    .attr("class", (d) => `halo nolabel${d.depth === 1 ? " strong" : ""}`)
    .attr("dy", "0.32em").attr("text-anchor", "middle")
    .attr("transform", (d) => {
      const angle = (((d.x0 + d.x1) / 2) * 180) / Math.PI;
      const radius = ((d.y0 + d.y1) / 2) * ring;
      return `rotate(${angle - 90}) translate(${radius},0) rotate(${angle < 180 ? 0 : 180})`;
    })
    .text((d) => fit(d.data.c.name, ring - 10));
  const center = chart.append("g").style("cursor", "default");
  center.append("circle").attr("r", ring - 2).style("fill", "var(--wash)");
  center.append("text").attr("class", "hero nolabel").attr("text-anchor", "middle").attr("dy", "0.1em")
    .text(totalChats().toLocaleString("en-US"));
  center.append("text").attr("class", "nolabel").attr("text-anchor", "middle").attr("dy", "1.6em").text("chats");
  box.replaceChildren(chart.node());
}

// ---------- icicle ----------
function renderIcicle(box) {
  const root = buildHierarchy();
  const W = chartWidth(box);
  const H = Math.max(420, Math.min(1400, root.leaves().length * 24));
  d3.partition().size([H, W]).padding(2)(root);
  const chart = newChart([0, 0, W, H], "Icicle chart of clusters");
  const cell = chart.append("g").selectAll("g").data(root.descendants()).join("g")
    .attr("transform", (d) => `translate(${d.y0},${d.x0})`);
  bind(fill(cell.append("rect")
    .attr("class", (d) => `node${isSelected(d.data.c) ? " selected" : ""}`)
    .attr("rx", 2)
    .attr("width", (d) => Math.max(0, d.y1 - d.y0 - 2))
    .attr("height", (d) => Math.max(0, d.x1 - d.x0)), (d) => d.data.c), (d) => d.data.c);
  const labeled = cell.filter((d) => d.x1 - d.x0 >= 16);
  labeled.append("text")
    .attr("class", (d) => `halo nolabel${d.depth <= 1 ? " strong" : ""}`)
    .attr("x", 6).attr("y", 15)
    .text((d) => fit(d.data.c ? d.data.c.name : "All chats", d.y1 - d.y0 - 14));
  labeled.filter((d) => d.x1 - d.x0 >= 34).append("text")
    .attr("class", "halo nolabel").attr("x", 6).attr("y", 30)
    .text((d) => plural(d.value, "chat"));
  box.replaceChildren(chart.node());
}

// ---------- treemap ----------
function renderTreemap(box) {
  const root = buildHierarchy();
  const W = chartWidth(box);
  const H = Math.round(W * 0.7);
  d3.treemap().tile(d3.treemapSquarify).size([W, H]).round(true)
    .paddingOuter(3).paddingInner(2).paddingTop((d) => (d.depth === 1 ? 22 : 3))(root);
  const chart = newChart([0, 0, W, H], "Treemap of clusters");
  const groups = root.descendants().filter((d) => d.depth >= 1 && d.children);
  chart.append("g").selectAll("rect").data(groups).join("rect")
    .attr("class", (d) => (d.depth === 1 ? "frame" : "outline"))
    .attr("rx", 3)
    .attr("x", (d) => d.x0).attr("y", (d) => d.y0)
    .attr("width", (d) => d.x1 - d.x0).attr("height", (d) => d.y1 - d.y0);
  bind(chart.append("g").selectAll("text").data(groups.filter((d) => d.depth === 1)).join("text")
    .attr("class", "halo strong").attr("x", (d) => d.x0 + 6).attr("y", (d) => d.y0 + 15)
    .style("cursor", "pointer")
    .text((d) => fit(`${d.data.c.name} · ${d.value}`, d.x1 - d.x0 - 12, 12, 600)), (d) => d.data.c);
  const leaf = chart.append("g").selectAll("g").data(root.leaves()).join("g")
    .attr("transform", (d) => `translate(${d.x0},${d.y0})`);
  bind(fill(leaf.append("rect")
    .attr("class", (d) => `node${isSelected(d.data.c) ? " selected" : ""}`)
    .attr("rx", 2)
    .attr("width", (d) => Math.max(0, d.x1 - d.x0)).attr("height", (d) => Math.max(0, d.y1 - d.y0)),
  (d) => d.data.c), (d) => d.data.c);
  const named = leaf.filter((d) => d.x1 - d.x0 > 50 && d.y1 - d.y0 > 20);
  named.append("text").attr("class", "halo nolabel").attr("x", 5).attr("y", 14)
    .text((d) => fit(d.data.c.name, d.x1 - d.x0 - 10));
  named.filter((d) => d.y1 - d.y0 > 36).append("text").attr("class", "halo nolabel").attr("x", 5).attr("y", 29)
    .text((d) => plural(d.value, "chat"));
  box.replaceChildren(chart.node());
}

// ---------- circle packing ----------
function renderPack(box) {
  const root = buildHierarchy();
  const W = Math.min(chartWidth(box), 860);
  d3.pack().size([W, W]).padding((d) => (d.depth === 0 ? 8 : 4))(root);
  const chart = newChart([0, 0, W, W], "Circle packing of clusters");
  const node = chart.append("g").selectAll("circle").data(root.descendants()).join("circle")
    .attr("cx", (d) => d.x).attr("cy", (d) => d.y).attr("r", (d) => d.r)
    .attr("class", (d) => (d.children ? (d.depth === 0 ? "outline" : "frame") : "node")
      + (isSelected(d.data.c) ? " selected" : ""));
  fill(node.filter((d) => !d.children), (d) => d.data.c);
  bind(node.filter((d) => d.depth > 0), (d) => d.data.c);
  chart.append("g").selectAll("text").data(root.descendants().filter((d) => d.depth === 1 && d.r > 34)).join("text")
    .attr("class", "halo nolabel strong").attr("text-anchor", "middle")
    .attr("x", (d) => d.x).attr("y", (d) => d.y - d.r + 16)
    .text((d) => fit(d.data.c.name, d.r * 1.5, 12, 600));
  chart.append("g").selectAll("text").data(root.leaves().filter((d) => d.r > 24)).join("text")
    .attr("class", "halo nolabel").attr("text-anchor", "middle")
    .attr("x", (d) => d.x).attr("y", (d) => d.y).attr("dy", "0.32em")
    .text((d) => fit(d.data.c.name, d.r * 1.9 - 6, 11));
  box.replaceChildren(chart.node());
}

// ---------- network graph ----------
function renderNetwork(box) {
  const W = chartWidth(box);
  const H = Math.max(520, Math.round(W * 0.72));
  const shown = CLUSTERS.filter((c) => count(c) > 0);
  const r = radiusScale(Math.max(1, ...shown.map(count)), 3, 14);
  const nodes = shown.map((c) => ({ id: c.id, c, kind: "cluster", radius: r(count(c)) }));
  USERS.forEach((u, i) => {
    if (USERS.length > 1 && (!state.user || state.user === u.label)) {
      nodes.push({ id: `user:${u.label}`, user: u, slot: i + 1, kind: "user", radius: 16 });
    }
  });
  const ids = new Set(nodes.map((n) => n.id));
  const links = [];
  for (const c of shown) {
    if (c.parent && ids.has(c.parent)) links.push({ source: c.parent, target: c.id, kind: "tree", level: c.level });
  }
  for (const c of shown.filter((x) => x.level === maxLevel)) {
    USERS.forEach((u, i) => {
      const n = mixOf.get(c.id)[i];
      if (n && ids.has(`user:${u.label}`)) links.push({ source: `user:${u.label}`, target: c.id, kind: "user", slot: i + 1, value: n });
    });
  }
  const simulation = d3.forceSimulation(nodes)
    .force("link", d3.forceLink(links).id((d) => d.id)
      .distance((l) => (l.kind === "tree" ? 22 + 14 * (maxLevel - l.level + 1) : 70))
      .strength((l) => (l.kind === "tree" ? 0.8 : 0.12)))
    .force("charge", d3.forceManyBody().strength((d) => (d.kind === "user" ? -900 : -60 - 6 * d.radius)))
    .force("collide", d3.forceCollide((d) => d.radius + 4))
    .force("x", d3.forceX(W / 2).strength(0.03))
    .force("y", d3.forceY(H / 2).strength(0.05))
    .stop();
  for (let i = 0; i < 400; i += 1) simulation.tick();
  for (const n of nodes) {
    n.x = Math.max(n.radius + 4, Math.min(W - n.radius - 4, n.x));
    n.y = Math.max(n.radius + 18, Math.min(H - n.radius - 18, n.y));
  }
  const chart = newChart([0, 0, W, H], "Network of users and clusters");
  chart.append("g").selectAll("line").data(links).join("line")
    .attr("class", (l) => (l.kind === "tree" ? "link" : "flow"))
    .attr("x1", (l) => l.source.x).attr("y1", (l) => l.source.y)
    .attr("x2", (l) => l.target.x).attr("y2", (l) => l.target.y)
    .style("stroke", (l) => (l.kind === "user" ? `var(--user-${l.slot})` : null))
    .style("stroke-opacity", (l) => (l.kind === "user" ? 0.4 : null))
    .attr("stroke-width", (l) => (l.kind === "user" ? 1 + 1.4 * Math.sqrt(l.value) : 1.2));
  const clusterNodes = chart.append("g").selectAll("g").data(nodes.filter((n) => n.kind === "cluster")).join("g")
    .attr("transform", (n) => `translate(${n.x},${n.y})`);
  clusterNodes.append("circle").attr("class", "hit").attr("r", (n) => Math.max(12, n.radius + 3));
  fill(clusterNodes.append("circle")
    .attr("class", (n) => `node${isSelected(n.c) ? " selected" : ""}`)
    .attr("r", (n) => n.radius), (n) => n.c);
  bind(clusterNodes, (n) => n.c);
  // Keep each label's middle far enough from the edges that the whole label fits
  const topLabels = nodes.filter((n) => n.kind === "cluster" && n.c.level === 0)
    .map((n) => ({ n, text: fit(n.c.name, 170, 12, 600) }))
    .map((l) => ({ ...l, half: textWidth(l.text, 12, 600) / 2 + 4 }));
  chart.append("g").selectAll("text").data(topLabels).join("text")
    .attr("class", "halo nolabel strong").attr("text-anchor", "middle")
    .attr("x", (l) => Math.max(l.half, Math.min(W - l.half, l.n.x)))
    .attr("y", (l) => Math.max(14, l.n.y - l.n.radius - 6))
    .text((l) => l.text);
  const userNodes = chart.append("g").selectAll("g").data(nodes.filter((n) => n.kind === "user")).join("g")
    .attr("transform", (n) => `translate(${n.x},${n.y})`);
  userNodes.append("rect").attr("class", "node").attr("x", -12).attr("y", -12).attr("width", 24).attr("height", 24).attr("rx", 5)
    .style("fill", (n) => `var(--user-${n.slot})`).style("cursor", "pointer")
    .on("click", (event, n) => setUser(state.user === n.user.label ? null : n.user.label));
  userNodes.append("text").attr("class", "halo nolabel strong").attr("text-anchor", "middle").attr("y", 28)
    .text((n) => n.user.label);
  box.replaceChildren(chart.node());
}

// ---------- flow (sankey) ----------
function renderFlow(box) {
  if (!HAS_SANKEY) {
    box.replaceChildren(el("p", { class: "notice" }, "This view needs the d3-sankey library, which could not be loaded."));
    return;
  }
  const W = chartWidth(box);
  const tops = roots.filter((r) => count(r) > 0);
  const second = maxLevel >= 1
    ? tops.flatMap((t) => (kids.get(t.id) || []).filter((k) => count(k) > 0))
    : [];
  const nodes = [];
  const links = [];
  const users = USERS.map((u, i) => ({ u, slot: i + 1 })).filter(({ u }) => !state.user || state.user === u.label);
  if (USERS.length) {
    for (const { u, slot } of users) nodes.push({ id: `user:${u.label}`, name: u.label, slot, kind: "user" });
    for (const t of tops) {
      for (const { u, slot } of users) {
        const n = mixOf.get(t.id)[slot - 1];
        if (n) links.push({ source: `user:${u.label}`, target: t.id, value: n, slot });
      }
    }
    for (const c of second) {
      for (const { slot } of users) {
        const n = mixOf.get(c.id)[slot - 1];
        if (n) links.push({ source: c.parent, target: c.id, value: n, slot });
      }
    }
  } else {
    nodes.push({ id: "all", name: "All chats", kind: "root" });
    for (const t of tops) links.push({ source: "all", target: t.id, value: count(t), slot: 1 });
    for (const c of second) links.push({ source: c.parent, target: c.id, value: count(c), slot: 1 });
  }
  for (const c of [...tops, ...second]) nodes.push({ id: c.id, name: c.name, c, kind: "cluster" });
  const H = Math.max(420, Math.max(tops.length, second.length, users.length) * 30 + 40);
  // Every label sits to the right of its bar, so keep room on the right for the last column
  const rightRoom = Math.min(280, W * 0.3);
  const layout = d3.sankey().nodeId((d) => d.id).nodeWidth(12).nodePadding(12).nodeSort(null)
    .extent([[0, 10], [W - rightRoom, H - 10]]);
  const graph = layout({ nodes: nodes.map((d) => ({ ...d })), links: links.map((d) => ({ ...d })) });
  const chart = newChart([0, 0, W, H], "Flow of chats from users into clusters");
  chart.append("g").selectAll("path").data(graph.links).join("path")
    .attr("class", "flow")
    .attr("d", d3.sankeyLinkHorizontal())
    .style("stroke", (l) => `var(--user-${l.slot})`)
    .style("stroke-opacity", 0.35)
    .attr("stroke-width", (l) => Math.max(1, l.width))
    .on("pointermove", (event, l) => showFlowTip(l, event.clientX, event.clientY))
    .on("pointerleave", hideTip);
  const node = chart.append("g").selectAll("g").data(graph.nodes).join("g");
  node.append("rect")
    .attr("class", (d) => `node${isSelected(d.c) ? " selected" : ""}`)
    .attr("x", (d) => d.x0).attr("y", (d) => d.y0)
    .attr("width", (d) => d.x1 - d.x0).attr("height", (d) => Math.max(1, d.y1 - d.y0))
    .attr("rx", 2)
    .style("fill", (d) => (d.kind === "user" ? `var(--user-${d.slot})` : "var(--neutral)"))
    .style("fill-opacity", (d) => (d.kind === "user" ? 1 : 0.75));
  bind(node.filter((d) => d.kind === "cluster"), (d) => d.c);
  node.filter((d) => d.kind === "user").style("cursor", "pointer")
    .on("click", (event, d) => setUser(state.user === d.name ? null : d.name));
  // A label may run until the next column of bars, or to the edge for the last column
  const columnStarts = [...new Set(graph.nodes.map((d) => d.x0))].sort((a, b) => a - b);
  const room = (d) => {
    const next = columnStarts.find((x) => x > d.x0);
    return (next === undefined ? W : next) - d.x1 - 14;
  };
  node.append("text")
    .attr("class", (d) => `halo nolabel${d.kind !== "cluster" || d.c.level === 0 ? " strong" : ""}`)
    .attr("x", (d) => d.x1 + 6)
    .attr("y", (d) => (d.y0 + d.y1) / 2).attr("dy", "0.32em")
    .text((d) => fit(`${d.name} · ${d.value}`, room(d), 12, d.kind !== "cluster" || d.c.level === 0 ? 600 : 400));
  box.replaceChildren(chart.node());
}

// ---------- map (Kura's 2D layout) ----------
function levelName(level) {
  if (level === 0) return "Top-level groups";
  if (level === maxLevel) return `Level ${level + 1} (base clusters)`;
  return `Level ${level + 1}`;
}
function renderMap(box) {
  const SVG_NS = "http://www.w3.org/2000/svg";
  const svgEl = (tag, attrs) => {
    const node = document.createElementNS(SVG_NS, tag);
    for (const [key, value] of Object.entries(attrs)) node.setAttribute(key, String(value));
    return node;
  };
  const W = 760, H = 480, PAD = 30;
  const items = CLUSTERS.filter((c) => c.level === state.mapLevel);
  const xs = items.map((c) => c.x), ys = items.map((c) => c.y);
  const [x0, x1, y0, y1] = [Math.min(...xs), Math.max(...xs), Math.min(...ys), Math.max(...ys)];
  const sx = (v) => PAD + (x1 === x0 ? 0.5 : (v - x0) / (x1 - x0)) * (W - 2 * PAD);
  const sy = (v) => PAD + (y1 === y0 ? 0.5 : (y1 - v) / (y1 - y0)) * (H - 2 * PAD);
  const maxCount = Math.max(1, ...items.map((c) => c.chats.length));
  const radius = (c) => 5 + 17 * Math.sqrt(c.chats.length / maxCount);
  const chart = svgEl("svg", { class: "chart", viewBox: `0 0 ${W} ${H}`, role: "group", "aria-label": "Map of clusters" });
  const dots = [];
  for (const c of [...items].sort((a, b) => b.chats.length - a.chats.length)) {
    const cx = sx(c.x), cy = sy(c.y), r = radius(c);
    const g = svgEl("g", { tabindex: 0, role: "button", "data-focus": `dot-${c.id}`, "aria-label": `${c.name}, ${plural(count(c), "chat")}` });
    g.append(svgEl("circle", { class: "hit", cx, cy, r: Math.max(r + 4, 12) }));
    const [color, opacity] = paint(c);
    const dot = svgEl("circle", { class: `node${isSelected(c) ? " selected" : ""}`, cx, cy, r });
    dot.style.fill = count(c) > 0 ? color : "var(--grid)";
    dot.style.fillOpacity = count(c) > 0 ? opacity : 1;
    g.append(dot);
    g.addEventListener("click", () => select(c.id));
    g.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); select(c.id); }
    });
    tipEvents(g, c);
    dots.push({ c, g, cx, cy, r });
  }
  const boxes = [];
  const labels = [];
  for (const { c, cx, cy, r } of [...dots].sort((a, b) => count(b.c) - count(a.c)).slice(0, 8)) {
    if (count(c) === 0) continue;
    const text = fit(c.name, 220);
    const width = textWidth(text);
    const right = cx + r + 6 + width < W;
    const x = right ? cx + r + 6 : cx - r - 6;
    const area = { x0: right ? x : x - width, x1: right ? x + width : x, y0: cy - 9, y1: cy + 5 };
    if (boxes.some((b) => b.x0 < area.x1 && area.x0 < b.x1 && b.y0 < area.y1 && area.y0 < b.y1)) continue;
    boxes.push(area);
    const label = svgEl("text", { class: "halo nolabel", x, y: cy + 4, "text-anchor": right ? "start" : "end" });
    label.textContent = text;
    labels.push(label);
  }
  chart.append(...dots.map((d) => d.g), ...labels);
  const select_ = el("select", { id: "map-level" }, levelCounts.map((n, level) =>
    el("option", { value: level, selected: level === state.mapLevel }, `${levelName(level)} (${n})`)));
  select_.addEventListener("change", () => { state.mapLevel = Number(select_.value); renderView(); });
  box.replaceChildren(
    el("div", { class: "tools" }, el("label", { for: "map-level" }, "Show"), select_),
    el("figure", { style: "margin: 0" }, chart,
      el("figcaption", {}, "Kura places clusters with similar descriptions near each other. Use the Table view for the exact numbers.")));
}

// ---------- views ----------
const RENDERERS = {
  list: renderList, table: renderTable, tree: renderTreeChart, radial: renderRadial,
  sunburst: renderSunburst, icicle: renderIcicle, treemap: renderTreemap, pack: renderPack,
  network: renderNetwork, flow: renderFlow, map: renderMap,
};
function renderView() {
  const box = document.getElementById("view");
  const view = VIEWS.find((v) => v.id === state.view);
  hideTip();
  if (view.d3 && !HAS_D3) {
    box.replaceChildren(el("p", { class: "notice" }, "This view needs the D3 chart library, which could not be loaded. The List, Map, and Table views still work."));
    return;
  }
  keepFocus(box, () => RENDERERS[view.id](box));
}

// ---------- details ----------
function chatItem(chat) {
  const slot = userSlot.get(chat.user);
  const meta = [chat.user, fmtDate(chat.date), plural(chat.turns, "turn")].filter(Boolean).join(" · ");
  const conversation = el("details", { class: "conv" }, el("summary", {}, "Show conversation"));
  conversation.addEventListener("toggle", () => {
    if (!conversation.open || conversation.children.length > 1) return;
    conversation.append(...chat.messages.map(([role, text]) =>
      el("div", { class: `msg ${role}` },
        el("div", { class: "msg-role" }, role === "user" ? "User" : "Assistant"),
        el("div", { class: "msg-text" }, text))));
  });
  return el("article", { class: "chat" },
    el("div", { class: "chat-meta" }, slot ? swatch(slot) : null, meta),
    el("p", { class: "chat-summary" }, chat.summary || "(no summary)"),
    conversation);
}

function renderDetails() {
  const box = document.getElementById("details");
  const c = byId.get(state.selected);
  if (!c) {
    box.replaceChildren(el("p", { class: "muted" }, "Pick a cluster to see its chats."));
    return;
  }
  const parts = [];
  const path = ancestors(c);
  if (path.length) {
    parts.push(el("nav", { class: "crumbs", "aria-label": "Cluster path" },
      path.map((p, i) => [
        i ? el("span", { "aria-hidden": "true" }, "›") : null,
        el("button", { type: "button", class: "crumb", onclick: () => select(p.id) }, p.name),
      ])));
  }
  const n = count(c);
  parts.push(
    el("h2", { class: "detail-title" }, c.name),
    el("p", { class: "detail-desc" }, c.description),
    el("p", { class: "detail-stats" },
      `Level ${c.level + 1} of ${maxLevel + 1} · ${plural(n, "chat")}${state.user ? ` from ${state.user}` : ""}`));
  if (USERS.length > 1) {
    const mix = mixOf.get(c.id);
    parts.push(el("div", { class: "breakdown", "aria-label": "Chats per user" },
      USERS.map((u, i) => el("span", {}, swatch(i + 1), `${u.label}: ${mix[i]}`))));
  }
  const children = (kids.get(c.id) || []).filter((k) => count(k) > 0);
  if (children.length) {
    parts.push(el("h3", {}, "Smaller clusters inside"),
      el("ul", { class: "sub-list" }, children.map((k) =>
        el("li", {}, el("button", { type: "button", class: "link", onclick: () => select(k.id) }, k.name),
          el("span", { class: "count" }, count(k))))));
  }
  const chats = c.chats
    .map((id) => DATA.chats[id])
    .filter((chat) => chat && (!state.user || chat.user === state.user))
    .sort((a, b) => a.date.localeCompare(b.date));
  const limit = state.showAll ? chats.length : 40;
  parts.push(el("h3", {}, `Chats (${chats.length})`), el("div", {}, chats.slice(0, limit).map(chatItem)));
  if (chats.length > limit) {
    parts.push(el("button", { type: "button", class: "ghost more", onclick: () => { state.showAll = true; renderDetails(); } },
      `Show all ${chats.length} chats`));
  }
  box.replaceChildren(...parts);
}

// ---------- state changes ----------
function saveHash() {
  const params = new URLSearchParams();
  params.set("view", state.view);
  if (state.user) params.set("user", state.user);
  if (state.view === "map") params.set("level", String(state.mapLevel));
  history.replaceState(null, "", `#${params}`);
}
function loadHash() {
  const params = new URLSearchParams(location.hash.slice(1));
  const view = params.get("view");
  if (VIEWS.some((v) => v.id === view)) state.view = view;
  const user = params.get("user");
  if (userSlot.has(user)) state.user = user;
  const level = Number(params.get("level"));
  if (Number.isInteger(level) && level >= 0 && level <= maxLevel && params.has("level")) state.mapLevel = level;
}
// Keep the details useful: if the open cluster has none of the picked user's chats, open their biggest group
function pickVisibleSelection() {
  const open = byId.get(state.selected);
  if (open && count(open) > 0) return;
  const biggest = roots.filter((r) => count(r) > 0).sort((a, b) => count(b) - count(a))[0];
  if (biggest) state.selected = biggest.id;
}
function setUser(user) {
  state.user = user;
  state.showAll = false;
  pickVisibleSelection();
  renderKpis();
  renderFilters();
  renderViewPicker();
  renderView();
  renderDetails();
  saveHash();
}
function setView(view) {
  state.view = view;
  renderViewPicker();
  renderView();
  saveHash();
}
function select(id) {
  const c = byId.get(id);
  if (!c) return;
  state.selected = id;
  state.showAll = false;
  for (const a of ancestors(c)) state.expanded.add(a.id);
  renderView();
  renderDetails();
  document.getElementById("details").scrollTop = 0;
}
function toggleOpen(id) {
  if (state.expanded.has(id)) state.expanded.delete(id);
  else state.expanded.add(id);
  renderView();
}

// ---------- theme ----------
const themeButton = document.getElementById("theme");
const darkQuery = window.matchMedia("(prefers-color-scheme: dark)");
function currentTheme() {
  return document.documentElement.dataset.theme || (darkQuery.matches ? "dark" : "light");
}
function renderThemeButton() {
  themeButton.textContent = currentTheme() === "dark" ? "Light mode" : "Dark mode";
}
try {
  const saved = localStorage.getItem("kura-report-theme");
  if (saved === "light" || saved === "dark") document.documentElement.dataset.theme = saved;
} catch (e) { /* storage can be blocked; the system theme still applies */ }
themeButton.addEventListener("click", () => {
  const next = currentTheme() === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem("kura-report-theme", next); } catch (e) { /* ignore */ }
  renderThemeButton();
});
darkQuery.addEventListener("change", renderThemeButton);

let resizeTimer = null;
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(renderView, 150);
});

loadHash();
pickVisibleSelection();
renderThemeButton();
renderHeader();
renderKpis();
renderFilters();
renderUsers();
renderViewPicker();
renderView();
renderDetails();
</script>
</body>
